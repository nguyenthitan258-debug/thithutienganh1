<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề Thi Thử Tiếng Anh – THPT Hoàng Quốc Việt</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-light: #818cf8;
    --accent: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --sky: #0ea5e9;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 8px 32px rgba(79,70,229,0.10);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 30%, #f093fb 60%, #f5576c 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    animation: bgShift 12s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0%   { background: linear-gradient(135deg,#667eea,#764ba2,#f093fb,#f5576c); }
    50%  { background: linear-gradient(135deg,#4facfe,#00f2fe,#43e97b,#38f9d7); }
    100% { background: linear-gradient(135deg,#fa709a,#fee140,#f093fb,#667eea); }
  }

  .quiz-wrapper {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 20px;
    animation: fadeDown 0.6s ease;
  }

  .header .school-tag {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 50px;
    margin-bottom: 8px;
  }

  .header h1 {
    font-family: 'Baloo 2', cursive;
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    line-height: 1.2;
  }

  .header h1 span { color: #fde68a; }

  /* ===== PROGRESS ===== */
  .progress-bar-wrap {
    background: rgba(255,255,255,0.25);
    border-radius: 50px;
    height: 10px;
    margin: 14px 0 6px;
    overflow: hidden;
    backdrop-filter: blur(4px);
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #fde68a, #f59e0b, #fbbf24);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,2,.6,1);
    box-shadow: 0 0 10px #fbbf2480;
  }

  .progress-label {
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    font-weight: 700;
    text-align: right;
  }

  /* ===== CARD ===== */
  .card {
    background: #fff;
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    animation: cardPop 0.45s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes cardPop {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== QUESTION ===== */
  .q-category {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(90deg, #818cf8, #c084fc);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 50px;
    margin-bottom: 14px;
  }

  .q-number {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 22px;
  }

  .q-text em { font-style: italic; color: var(--primary); }

  /* ===== OPTIONS ===== */
  .options { display: grid; gap: 10px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    background: #f8faff;
    border: 2px solid #e8edf8;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    transition: all 0.22s ease;
    position: relative;
    overflow: hidden;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary-light);
    background: #eef2ff;
    transform: translateX(4px);
    box-shadow: 0 4px 16px rgba(79,70,229,0.10);
  }

  .option-btn:disabled { cursor: not-allowed; }

  .opt-letter {
    min-width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: transform 0.2s;
  }

  .option-btn:hover:not(:disabled) .opt-letter { transform: rotate(-5deg) scale(1.1); }

  .opt-content { flex: 1; }
  .opt-text { display: block; }

  .opt-explanation {
    display: none;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
  }

  /* States */
  .option-btn.correct {
    background: #f0fdf4;
    border-color: var(--green);
    animation: correctPop 0.4s ease;
  }

  .option-btn.correct .opt-letter { background: var(--green); }
  .option-btn.correct .opt-explanation {
    display: block;
    background: #dcfce7;
    color: #166534;
  }

  .option-btn.wrong {
    background: #fff1f2;
    border-color: var(--red);
    animation: shake 0.5s ease;
  }

  .option-btn.wrong .opt-letter { background: var(--red); }
  .option-btn.wrong .opt-explanation {
    display: block;
    background: #fee2e2;
    color: #991b1b;
  }

  .option-btn.other-dimmed {
    opacity: 0.5;
    background: #f8faff;
  }

  .option-btn.highlight-correct {
    background: #f0fdf4;
    border-color: var(--green);
  }

  .option-btn.highlight-correct .opt-letter { background: var(--green); }
  .option-btn.highlight-correct .opt-explanation {
    display: block;
    background: #dcfce7;
    color: #166534;
  }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    40%       { transform: translateX(8px); }
    60%       { transform: translateX(-5px); }
    80%       { transform: translateX(5px); }
  }

  /* ===== FILL-IN-BLANK ===== */
  .fill-section {
    margin-top: 22px;
    padding: 20px;
    background: linear-gradient(135deg, #fef9c3, #fef3c7);
    border: 2px dashed var(--accent);
    border-radius: 16px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fill-title {
    font-size: 14px;
    font-weight: 800;
    color: #92400e;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .fill-prompt {
    font-size: 13px;
    color: #78350f;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .fill-input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .fill-input {
    flex: 1;
    min-width: 180px;
    padding: 10px 16px;
    border: 2px solid #fbbf24;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    background: #fffbeb;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .fill-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #fbbf2430; }

  .fill-input.correct-input {
    border-color: var(--green);
    background: #f0fdf4;
    color: #166534;
  }

  .fill-input.wrong-input {
    border-color: var(--red);
    background: #fff1f2;
    animation: shake 0.4s;
  }

  .btn-submit-fill {
    padding: 10px 22px;
    background: linear-gradient(135deg, var(--accent), #f97316);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 12px rgba(245,158,11,0.35);
  }

  .btn-submit-fill:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245,158,11,0.45); }
  .btn-submit-fill:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .fill-feedback {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }

  /* ===== NEXT BUTTON ===== */
  .next-area {
    display: none;
    margin-top: 20px;
    text-align: right;
    animation: fadeIn 0.3s ease;
  }

  .btn-next {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 30px;
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 20px rgba(79,70,229,0.35);
  }

  .btn-next:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 28px rgba(79,70,229,0.45); }

  .btn-next svg { transition: transform 0.2s; }
  .btn-next:hover svg { transform: translateX(4px); }

  /* ===== SCORE SCREEN ===== */
  .score-screen {
    display: none;
    text-align: center;
  }

  .score-badge {
    width: 150px;
    height: 150px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }

  .score-badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    filter: blur(20px);
    opacity: 0.3;
    transform: scale(1.4);
  }

  .score-badge .score-num {
    font-size: 40px;
    line-height: 1;
    position: relative;
    z-index: 1;
    color: #fff;
  }

  .score-badge .score-total {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    position: relative;
    z-index: 1;
  }

  .score-title {
    font-family: 'Baloo 2', cursive;
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .score-emoji { font-size: 32px; }

  .score-subtitle {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  /* Report */
  .report-section {
    text-align: left;
    margin-top: 24px;
  }

  .report-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .report-item {
    background: #fff8f8;
    border: 1.5px solid #fecaca;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .report-item .ri-q { font-weight: 800; color: var(--red); margin-bottom: 4px; }
  .report-item .ri-text { color: var(--text); font-weight: 600; line-height: 1.5; }
  .report-item .ri-ans { color: var(--green); font-weight: 700; margin-top: 4px; }

  .report-reviewed {
    background: #f0fdf4;
    border-color: #bbf7d0;
  }

  .report-reviewed .ri-q { color: var(--green); }
  .reviewed-badge {
    display: inline-block;
    background: var(--green);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 50px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(16,185,129,0.35);
    transition: transform 0.15s;
  }

  .btn-restart:hover { transform: translateY(-3px); }

  /* Start Screen */
  .start-screen {
    text-align: center;
    padding: 10px 0;
  }

  .start-screen .hero-icon {
    font-size: 70px;
    display: block;
    margin-bottom: 16px;
    animation: bounce 2s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  .start-screen h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .start-screen p {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .info-pills {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 50px;
  }

  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 44px;
    background: linear-gradient(135deg, #f59e0b, #ef4444, #ec4899);
    background-size: 200% 200%;
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    animation: gradientShift 3s ease infinite;
    box-shadow: 0 8px 28px rgba(239,68,68,0.4);
    transition: transform 0.15s;
  }

  .btn-start:hover { transform: scale(1.05) translateY(-3px); }

  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .card { padding: 22px 18px; }
    .q-text { font-size: 16px; }
    .option-btn { font-size: 14px; padding: 12px 14px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="quiz-wrapper">
  <div class="header">
    <div class="school-tag">🏫 THPT Hoàng Quốc Việt – Thái Nguyên</div>
    <h1>THI THỬ <span>TIẾNG ANH</span> 🇬🇧</h1>
    <div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progressLabel">0 / 40 câu</div>
    </div>
  </div>

  <div class="card" id="mainCard">
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
      <span class="hero-icon">📝</span>
      <h2>Bạn đã sẵn sàng chưa?</h2>
      <p>Đề thi thử Tuyển sinh vào lớp 10 THPT<br>Môn: <strong>Tiếng Anh</strong> – Mã đề <strong>104</strong></p>
      <div class="info-pills">
        <div class="pill">📚 40 câu hỏi</div>
        <div class="pill">⏱️ 60 phút</div>
        <div class="pill">🌐 Song ngữ Anh – Việt</div>
        <div class="pill">💡 Giải thích từng đáp án</div>
      </div>
      <button class="btn-start" onclick="startQuiz()">
        🚀 Bắt đầu làm bài
      </button>
    </div>

    <!-- Question Screen -->
    <div id="questionScreen" style="display:none">
      <div class="q-category" id="qCategory">📌 Grammar</div>
      <div class="q-number" id="qNumber">Câu 1 / 40</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsContainer"></div>
      <div id="fillSection" style="display:none"></div>
      <div class="next-area" id="nextArea">
        <button class="btn-next" id="btnNext" onclick="nextQuestion()">
          Câu tiếp theo
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- Score Screen -->
    <div class="score-screen" id="scoreScreen">
      <div class="score-badge" id="scoreBadge">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-total">/40</div>
      </div>
      <div class="score-emoji" id="scoreEmoji">🎉</div>
      <div class="score-title" id="scoreTitle">Kết quả bài thi</div>
      <div class="score-subtitle" id="scoreSubtitle"></div>
      <div class="divider"></div>
      <div class="report-section" id="reportSection"></div>
      <div style="text-align:center">
        <button class="btn-restart" onclick="restartQuiz()">
          🔄 Làm lại bài
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// =============================================
// QUESTION DATA
// =============================================
const questions = [
  {
    id: 1,
    category: "📌 Grammar – Chia động từ",
    text: "If it __________ tomorrow, we will cancel the picnic.",
    options: ["rains", "will rain", "rained", "is raining"],
    correct: 0,
    explanations: [
      "✅ ĐÚNG! Câu điều kiện loại 1 (Real Conditional): If + <em>hiện tại đơn</em>, will + V. <br><strong>Correct! Type 1 Conditional: If + Simple Present, will + V-infinitive.</strong>",
      "❌ Sai. Không dùng 'will' trong mệnh đề điều kiện (after 'if'). <br><em>Wrong. Never use 'will' in the 'if' clause of a conditional sentence.</em>",
      "❌ Sai. 'rained' là quá khứ đơn, dùng trong câu điều kiện loại 2 (If + V-ed). <br><em>Wrong. 'rained' is past simple, used in Type 2 Conditional.</em>",
      "❌ Sai. Không dùng thì tiếp diễn sau 'if' trong câu điều kiện loại 1. <br><em>Wrong. Progressive tense is not used here.</em>"
    ],
    fillPrompt: "Gõ đáp án đúng (dạng động từ trong mệnh đề 'if'): / Type the correct verb form:",
    correctAnswer: "rains"
  },
  {
    id: 2,
    category: "📌 Vocabulary – Từ vựng",
    text: "That television program is not only __________ but also entertaining.",
    options: ["convenient", "informative", "economical", "necessary"],
    correct: 1,
    explanations: [
      "❌ Sai. 'Convenient' = tiện lợi, không đi kèm với 'entertaining' hợp nghĩa. <br><em>Wrong. 'Convenient' = suitable/easy to use, doesn't pair well with 'entertaining'.</em>",
      "✅ ĐÚNG! 'Informative' = có nhiều thông tin bổ ích. Chương trình vừa <em>bổ ích</em> vừa <em>giải trí</em>. <br><strong>Correct! 'Informative' = providing useful information, perfect pair with 'entertaining'.</strong>",
      "❌ Sai. 'Economical' = tiết kiệm, không phù hợp với ngữ cảnh này. <br><em>Wrong. 'Economical' = saving money/resources.</em>",
      "❌ Sai. 'Necessary' = cần thiết, không phù hợp ý nghĩa câu. <br><em>Wrong. 'Necessary' = needed/essential, doesn't fit here.</em>"
    ],
    fillPrompt: "Gõ đáp án đúng (tính từ còn thiếu): / Type the correct adjective:",
    correctAnswer: "informative"
  },
  {

      "❌ Sai. Bài không nói HappyNews chỉ viết về phụ nữ (60% là độc giả nữ, không phải chủ đề). <br><em>Wrong. 60% female readers ≠ stories only about women.</em>",
      "❌ Sai. Bài không đề cập tất cả bài do Reese viết. <br><em>Wrong. The passage doesn't say Reese wrote all stories.</em>",
      "✅ ĐÚNG! HappyNews khác biệt vì tập trung vào tin tức tích cực, không phải tin xấu như các nguồn khác. <br><strong>Correct! HappyNews focuses on positive/good news, unlike other sources reporting bad events.</strong>",
      "❌ Sai. Bài không so sánh mức độ phóng đại. <br><em>Wrong. The passage doesn't claim HappyNews doesn't exaggerate.</em>"
    ],
    fillPrompt: "Gõ loại tin tức mà HappyNews không đăng: / Type what type of news HappyNews avoids:",
    correctAnswer: "bad"
  },
  {
    id: 39,
    category: "📰 Reading Comprehension – Đọc hiểu",
    text: 'The word "<u>they</u>" in paragraph 2 refers to ________.',
    options: ["issues", "sources", "people", "problems"],
    correct: 2,
    explanations: [
      "❌ Sai. 'Issues' là đề tài/vấn đề (danh từ chỉ vật), không thể dùng đại từ 'they' chỉ người. <br><em>Wrong. 'Issues' are things, not people who make decisions.</em>",
      "❌ Sai. 'Sources' = nguồn tin (vật), không phải đối tượng đưa ra quyết định có thông tin. <br><em>Wrong. 'Sources' are things, not the ones making informed decisions.</em>",
      "✅ ĐÚNG! 'They' = 'People' – câu trước đó: 'People need to know about issues... Then they are better able to make informed decisions.' <br><strong>Correct! 'They' refers back to 'People' (the ones who make informed decisions after knowing about issues).</strong>",
      "❌ Sai. 'Problems' là danh từ chỉ vật, không phải chủ thể ra quyết định. <br><em>Wrong. 'Problems' are things, not agents making decisions.</em>"
    ],
    fillPrompt: "Gõ danh từ mà 'they' thay thế: / Type the noun that 'they' refers to:",
    correctAnswer: "people"
  },
  {
    id: 40,
    category: "📰 Reading Comprehension – Đọc hiểu",
    text: "Which of the following is NOT TRUE about HappyNews after its first month online?",
    options: [
      "Most of its readers were women.",
      "Readers sent in nice letters about it every day.",
      "It had thousands of readers.",
      "Reese used it to create other websites."
    ],
    correct: 3,
    explanations: [
      "❌ Sai (= Đúng trong bài). Bài có đề cập 60% độc giả là phụ nữ. <br><em>Wrong choice. The passage DOES mention 60% of readers were women (this statement IS true).</em>",
      "❌ Sai (= Đúng trong bài). HappyNews nhận fan mail mỗi ngày. <br><em>Wrong choice. The passage DOES say HappyNews gets fan mail daily (this IS true).</em>",
      "❌ Sai (= Đúng trong bài). Hơn 70,000 độc giả = hàng chục nghìn. <br><em>Wrong choice. 70,000+ unique readers IS mentioned in the passage (true).</em>",
      "✅ ĐÚNG (câu NOT TRUE)! Bài không đề cập Reese dùng HappyNews để tạo website khác. Đây là thông tin sai. <br><strong>Correct! The passage NEVER mentions Reese creating other websites through HappyNews. This is FALSE.</strong>"
    ],
    fillPrompt: "Gõ tên người sáng lập HappyNews: / Type the name of HappyNews' founder:",
    correctAnswer: "reese"
  }
];

// =============================================
// STATE
// =============================================
let currentIndex = 0;
let score = 0;
let answered = false;
let wrongAnswers = []; // {qIndex, reviewed}
let fillReviewed = false;

function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('questionScreen').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  fillReviewed = false;
  const q = questions[currentIndex];

  document.getElementById('qCategory').innerHTML = q.category;
  document.getElementById('qNumber').textContent = `Câu ${q.id} / 40`;
  document.getElementById('qText').innerHTML = q.text.replace(/\n/g, '<br>');

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.id = `opt-${i}`;
    btn.innerHTML = `
      <div class="opt-letter">${letters[i]}</div>
      <div class="opt-content">
        <span class="opt-text">${opt}</span>
        <div class="opt-explanation" id="exp-${i}">${q.explanations[i]}</div>
      </div>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  document.getElementById('fillSection').style.display = 'none';
  document.getElementById('fillSection').innerHTML = '';
  document.getElementById('nextArea').style.display = 'none';

  updateProgress();

  // Animate card
  const card = document.getElementById('mainCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'cardPop 0.45s cubic-bezier(.34,1.56,.64,1)';
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const isCorrect = chosen === q.correct;

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
    const exp = document.getElementById(`exp-${i}`);

    if (i === chosen) {
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      exp.style.display = 'block';
    } else if (i === q.correct && !isCorrect) {
      btn.classList.add('highlight-correct');
      exp.style.display = 'block';
    } else {
      btn.classList.add('other-dimmed');
    }
  }

  if (isCorrect) {
    score++;
    document.getElementById('nextArea').style.display = 'block';
  } else {
    wrongAnswers.push({ qIndex: currentIndex, reviewed: false });
    showFillSection();
  }
}

function showFillSection() {
  const q = questions[currentIndex];
  const fill = document.getElementById('fillSection');
  fill.style.display = 'block';
  fill.innerHTML = `
    <div class="fill-section">
      <div class="fill-title">✍️ Ôn lại kiến thức / Review Knowledge</div>
      <div class="fill-prompt">${q.fillPrompt}<br>
        <strong>→ Đáp án đúng là: "<em>${q.correctAnswer}</em>"</strong> – Hãy gõ lại để ghi nhớ!<br>
        <em>The correct answer is "${q.correctAnswer}" – Type it to reinforce your memory!</em>
      </div>
      <div class="fill-input-row">
        <input type="text" class="fill-input" id="fillInput" placeholder="Gõ đáp án đúng vào đây..." autocomplete="off" />
        <button class="btn-submit-fill" id="btnFillSubmit" onclick="checkFill()">Xác nhận ✓</button>
      </div>
      <div class="fill-feedback" id="fillFeedback"></div>
    </div>`;

  document.getElementById('fillInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkFill();
  });
  setTimeout(() => document.getElementById('fillInput').focus(), 200);
}

function checkFill() {
  const q = questions[currentIndex];
  const input = document.getElementById('fillInput');
  const feedback = document.getElementById('fillFeedback');
  const typed = input.value.trim().toLowerCase();
  const correct = q.correctAnswer.toLowerCase();

  if (typed === correct) {
    input.classList.remove('wrong-input');
    input.classList.add('correct-input');
    input.disabled = true;
    document.getElementById('btnFillSubmit').disabled = true;
    feedback.style.display = 'block';
    feedback.style.color = '#166534';
    feedback.innerHTML = '✅ Chính xác! Tuyệt vời! / Correct! Well done!';

    // Mark as reviewed
    const entry = wrongAnswers.find(w => w.qIndex === currentIndex);
    if (entry) entry.reviewed = true;
    fillReviewed = true;

    setTimeout(() => {
      document.getElementById('nextArea').style.display = 'block';
    }, 600);
  } else {
    input.classList.add('wrong-input');
    feedback.style.display = 'block';
    feedback.style.color = '#991b1b';
    feedback.innerHTML = `❌ Chưa đúng. Hãy thử lại! / Not quite. Try again! (Gợi ý / Hint: "${q.correctAnswer[0]}...")`;
    setTimeout(() => { input.classList.remove('wrong-input'); }, 500);
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showScore();
  } else {
    renderQuestion();
  }
}

function updateProgress() {
  const pct = (currentIndex / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${currentIndex} / ${questions.length} câu`;
}

function showScore() {
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = `${questions.length} / ${questions.length} câu`;

  const screen = document.getElementById('scoreScreen');
  screen.style.display = 'block';

  const badge = document.getElementById('scoreBadge');
  const pct = score / questions.length;

  let gradient, emoji, title, subtitle;
  if (pct >= 0.9) {
    gradient = 'linear-gradient(135deg,#10b981,#059669)';
    emoji = '🏆🎉🌟'; title = 'Xuất sắc! / Excellent!';
    subtitle = `Điểm số tuyệt vời! Bạn đã nắm vững kiến thức.\nYou've mastered this material!`;
  } else if (pct >= 0.75) {
    gradient = 'linear-gradient(135deg,#3b82f6,#6366f1)';
    emoji = '👏😊'; title = 'Giỏi! / Well done!';
    subtitle = 'Kết quả tốt! Ôn lại các câu sai nhé. / Good result! Review your mistakes.';
  } else if (pct >= 0.5) {
    gradient = 'linear-gradient(135deg,#f59e0b,#ef4444)';
    emoji = '💪📚'; title = 'Cố lên! / Keep it up!';
    subtitle = 'Cần ôn luyện thêm nhé. / You need a bit more practice.';
  } else {
    gradient = 'linear-gradient(135deg,#ef4444,#dc2626)';
    emoji = '📖💡'; title = 'Cần cố gắng hơn! / Need more effort!';
    subtitle = 'Hãy ôn tập kỹ và thử lại! / Study more and try again!';
  }

  badge.style.background = gradient;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreSubtitle').innerHTML = subtitle.replace('\n','<br>');

  // Report
  buildReport();

  // Confetti for good score
  if (pct >= 0.75) launchConfetti();
}

function buildReport() {
  const section = document.getElementById('reportSection');
  const notReviewed = wrongAnswers.filter(w => !w.reviewed);
  const reviewed = wrongAnswers.filter(w => w.reviewed);

  let html = '';

  if (wrongAnswers.length === 0) {
    html = '<div style="text-align:center;font-size:18px;font-weight:700;color:#10b981;padding:16px">🎊 Bạn trả lời đúng tất cả! Perfect score!</div>';
  } else {
    if (notReviewed.length > 0) {
      html += `<div class="report-title">⚠️ Câu sai chưa ôn lại / Wrong & Not Reviewed (${notReviewed.length} câu)</div>`;
      notReviewed.forEach(w => {
        const q = questions[w.qIndex];
        const correctOpt = q.options[q.correct];
        html += `
          <div class="report-item">
            <div class="ri-q">Câu ${q.id}:</div>
            <div class="ri-text">${q.text.replace(/<[^>]+>/g,'').replace(/\n/g,' ').substring(0,120)}...</div>
            <div class="ri-ans">✅ Đáp án đúng: ${correctOpt} / Correct: ${correctOpt}</div>
          </div>`;
      });
    }

    if (reviewed.length > 0) {
      html += `<div class="report-title" style="color:#10b981;margin-top:16px">✅ Câu sai đã ôn lại / Wrong but Reviewed (${reviewed.length} câu)</div>`;
      reviewed.forEach(w => {
        const q = questions[w.qIndex];
        const correctOpt = q.options[q.correct];
        html += `
          <div class="report-item report-reviewed">
            <div class="ri-q">Câu ${q.id}: <span class="reviewed-badge">Đã ôn ✓</span></div>
            <div class="ri-text">${q.text.replace(/<[^>]+>/g,'').replace(/\n/g,' ').substring(0,120)}...</div>
            <div class="ri-ans">✅ Đáp án: ${correctOpt}</div>
          </div>`;
      });
    }
  }

  section.innerHTML = html;
}

function launchConfetti() {
  const colors = ['#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#ef4444','#fbbf24'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random()*100}vw;
        top: -20px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        width: ${6+Math.random()*10}px;
        height: ${6+Math.random()*10}px;
        border-radius: ${Math.random()>0.5?'50%':'2px'};
        animation-duration: ${1.5+Math.random()*2}s;
        animation-delay: ${Math.random()*0.5}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 30);
  }
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  answered = false;
  wrongAnswers = [];
  fillReviewed = false;

  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('questionScreen').style.display = 'block';
  renderQuestion();
}
</script>
</body>
</html>
